name: Compile External Projects

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/labmec/neopz-deps:latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DUSING_LOG4CXX=ON \
            -DUSING_METIS=ON \
            -DUSING_MUMPS=ON \
            -DMUMPS_ROOT=$MUMPS_ROOT \
            -DMUMPS_USE_DOUBLE=ON \
            -DMUMPS_USE_COMPLEX16=ON

      - name: Build and Install PZ
        run: cmake --build build --target install
        env:
          MAKEFLAGS: "-j4"

      - name: Clone External Projects
        uses: actions/checkout@v2
        with:
          path: ./NeoPZExamples
          repository: labmec/NeoPZExamples
          ref: main

      - name: Configure CMake External Projects
        working-directory: ${{ github.workspace }}/NeoPZExamples
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install

      - name: Build External Projects
        working-directory: ${{ github.workspace }}/NeoPZExamples
        run: cmake --build build
        env:
          MAKEFLAGS: "-j4"

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create Build Environment
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build PZ
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: cmake --build . --config ${{ env.BUILD_TYPE }}
        env:
          MAKEFLAGS: "-j4"

      - name: Install PZ
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: cmake --build . --config ${{ env.BUILD_TYPE }} --target install
        env:
          MAKEFLAGS: "-j4"

      - name: Clone External Projects
        uses: actions/checkout@v2
        with:
          path: ./NeoPZExamples
          repository: labmec/NeoPZExamples
          ref: main

      - name: Configure CMake External Projects
        shell: bash
        working-directory: ${{ github.workspace }}/NeoPZExamples
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install

      - name: Build External Projects
        working-directory: ${{ github.workspace }}/NeoPZExamples
        shell: bash
        run: cmake --build build
        env:
          MAKEFLAGS: "-j4"     