name: Run Unit Tests with MKL
on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [main, develop]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/neopz-deps
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

permissions:
  contents: read
  packages: read

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      image_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: resolve
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BRANCH_NAME="${GITHUB_HEAD_REF}"
          fi
          BRANCH_TAG="$(echo "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          if [ "${BRANCH_NAME}" = "main" ] || [ "${BRANCH_NAME}" = "develop" ]; then
            TARGET_TAG="latest"
          else
            TARGET_TAG="${BRANCH_TAG}"
          fi
          IMAGE_REF="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):${TARGET_TAG}"
          echo "image_ref=${IMAGE_REF}" >> $GITHUB_OUTPUT

      - name: Check if image exists
        id: check
        shell: bash
        run: |
          if docker manifest inspect "${{ steps.resolve.outputs.image_ref }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  Run_unit_tests_with_MKL:
    if: needs.resolve-image.outputs.image_exists == 'true'
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout NeoPZ
        uses: actions/checkout@v3
      - name: Restore ccache
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/.ccache
          key: linux-ccache-mkl-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', '**/*.cmake', '.github/workflows/mkl_tests.yml') }}
          restore-keys: |
            linux-ccache-mkl-${{ env.BUILD_TYPE }}-
      - name: Restore build cache
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/build
          key: linux-build-mkl-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', '**/*.cmake', '.github/workflows/mkl_tests.yml') }}
          restore-keys: |
            linux-build-mkl-${{ env.BUILD_TYPE }}-
      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build
      - name: Configure ccache
        shell: bash
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          ccache --set-config=max_size=500M
          ccache --zero-stats
      - name: Validate Intel oneAPI in image
        shell: bash
        run: |
          test -f /opt/intel/oneapi/setvars.sh
      - name: Setup Intel oneAPI environment
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          printenv >> $GITHUB_ENV
      - name: Configure CMake
        shell: bash
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -GNinja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_UNITTESTING=ON -DUSING_MKL=ON -DMKL_ROOT=$MKLROOT -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_Fortran_COMPILER_LAUNCHER=ccache
      - name: Build
        shell: bash
        run: cmake --build "$GITHUB_WORKSPACE/build" --config $BUILD_TYPE
        env:
          MAKEFLAGS: "-j4"
      - name: ccache stats
        shell: bash
        run: ccache --show-stats
      - name: Run Unit Tests
        shell: bash
        run: ctest --test-dir "$GITHUB_WORKSPACE/build" -C $BUILD_TYPE
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
