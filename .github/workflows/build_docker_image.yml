name: Build and Push Docker Image

on:
  push:
    branches:
      - '*'
    paths:
      - '.github/docker/Dockerfile'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if image already exists'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  # github.repository_owner must be lowercase for Docker image names
  IMAGE_NAME: ${{ github.repository_owner }}/neopz-deps

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Resolve image tag
        id: image-tag
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BRANCH_NAME="${GITHUB_HEAD_REF}"
          fi
          BRANCH_TAG="$(echo "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')-container"
          if [ "${BRANCH_NAME}" = "main" ] || [ "${BRANCH_NAME}" = "develop" ]; then
            TARGET_TAG="latest"
          else
            TARGET_TAG="${BRANCH_TAG}"
          fi
          echo "target_tag=${TARGET_TAG}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):${{ steps.image-tag.outputs.target_tag }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        # Always rebuild when Dockerfile changed (push event), when forced, or when image is missing
        if: |
          github.event_name == 'push' ||
          inputs.force_rebuild == true ||
          steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .github/docker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.target_tag }}
