name: Build and Push Docker Image

on:
  push:
    branches:
      - '*'
    paths:
      - '.github/docker/Dockerfile'
      - '.github/workflows/build_docker_image.yml'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if image already exists'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  # github.repository_owner must be lowercase for Docker image names
  IMAGE_NAME: ${{ github.repository_owner }}/neopz-deps

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image tag
        id: image-tag
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BRANCH_NAME="${GITHUB_HEAD_REF}"
          fi
          BRANCH_TAG="$(echo "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          if [ "${BRANCH_NAME}" = "main" ] || [ "${BRANCH_NAME}" = "develop" ]; then
            TARGET_TAG="latest"
          else
            TARGET_TAG="${BRANCH_TAG}"
          fi
          echo "target_tag=${TARGET_TAG}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        # Build on push path filters or when manually forced
        if: |
          github.event_name == 'push' ||
          inputs.force_rebuild == true
        uses: docker/build-push-action@v7
        with:
          context: .github/docker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.target_tag }}
