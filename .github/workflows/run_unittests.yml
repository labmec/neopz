name: Run Unit Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [main, develop]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/neopz-deps
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

permissions:
  contents: read
  packages: read

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      image_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: resolve
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BRANCH_NAME="${GITHUB_HEAD_REF}"
          fi
          BRANCH_TAG="$(echo "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          if [ "${BRANCH_NAME}" = "main" ] || [ "${BRANCH_NAME}" = "develop" ]; then
            TARGET_TAG="latest"
          else
            TARGET_TAG="${BRANCH_TAG}"
          fi
          IMAGE_REF="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):${TARGET_TAG}"
          echo "image_ref=${IMAGE_REF}" >> $GITHUB_OUTPUT

      - name: Check if image exists
        id: check
        shell: bash
        run: |
          if docker manifest inspect "${{ steps.resolve.outputs.image_ref }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build-linux:
    if: needs.resolve-image.outputs.image_exists == 'true'
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v6

    - name: Restore ccache
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/.ccache
        key: linux-ccache-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', '**/*.cmake', '.github/workflows/run_unittests.yml') }}
        restore-keys: |
          linux-ccache-${{ env.BUILD_TYPE }}-
    
    - name: Restore build cache
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/build
        key: linux-build-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', '**/*.cmake', '.github/workflows/run_unittests.yml') }}
        restore-keys: |
          linux-build-${{ env.BUILD_TYPE }}-
    
    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure ccache
      shell: bash
      run: |
        echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
        ccache --set-config=max_size=500M
        ccache --zero-stats

    - name: Configure CMake
      shell: bash
      run: cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_UNITTESTING=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_Fortran_COMPILER_LAUNCHER=ccache
    - name: Build
      shell: bash
      run: cmake --build "$GITHUB_WORKSPACE/build" --config $BUILD_TYPE
      env:
        MAKEFLAGS: "-j4"
    - name: ccache stats
      shell: bash
      run: ccache --show-stats
    - name: Run Unit Tests
      shell: bash
      run: ctest --test-dir "$GITHUB_WORKSPACE/build" -C $BUILD_TYPE
      env:
        CTEST_OUTPUT_ON_FAILURE: 1

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install ccache
      run: brew install ccache

    - name: Install MUMPS build dependencies
      run: brew install gcc openblas metis libomp

    - name: Setup GNU Fortran
      shell: bash
      run: |
        GFORTRAN_BIN="$(find "$(brew --prefix)/bin" -maxdepth 1 -type f -name 'gfortran-*' | sort -V | tail -n1)"
        if [ -z "$GFORTRAN_BIN" ]; then
          GFORTRAN_BIN="$(command -v gfortran || true)"
        fi
        if [ -z "$GFORTRAN_BIN" ]; then
          echo "gfortran not found after brew install gcc" >&2
          exit 1
        fi
        echo "FC=$GFORTRAN_BIN" >> $GITHUB_ENV
        echo "F77=$GFORTRAN_BIN" >> $GITHUB_ENV
        echo "F90=$GFORTRAN_BIN" >> $GITHUB_ENV
        echo "CMAKE_FORTRAN_COMPILER=$GFORTRAN_BIN" >> $GITHUB_ENV

    - name: Restore ccache
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/.ccache
        key: macos-ccache-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', '**/*.cmake', '.github/workflows/run_unittests.yml') }}
        restore-keys: |
          macos-ccache-${{ env.BUILD_TYPE }}-
    
    - name: Restore build cache
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/build
        key: macos-build-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', '**/*.cmake', '.github/workflows/run_unittests.yml') }}
        restore-keys: |
          macos-build-${{ env.BUILD_TYPE }}-

    - name: Restore MUMPS install cache
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/mumps-install
        key: macos-mumps-${{ hashFiles('.github/workflows/run_unittests.yml') }}
        restore-keys: |
          macos-mumps-
    
    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Build and install MUMPS
      shell: bash
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/mumps-install/lib/cmake/mumps/MUMPSConfig.cmake" ] && [ ! -f "$GITHUB_WORKSPACE/mumps-install/cmake/MUMPSConfig.cmake" ]; then
          rm -rf "$GITHUB_WORKSPACE/mumps-src" "$GITHUB_WORKSPACE/mumps-build"
          git clone --depth=1 https://github.com/giavancini/mumps.git "$GITHUB_WORKSPACE/mumps-src"
          cmake -S "$GITHUB_WORKSPACE/mumps-src" -B "$GITHUB_WORKSPACE/mumps-build" -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER="$FC" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/mumps-install" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_SINGLE=ON \
            -DBUILD_DOUBLE=ON \
            -DBUILD_COMPLEX=ON \
            -DBUILD_COMPLEX16=ON \
            -DMUMPS_parallel=OFF \
            -DMUMPS_openmp=ON \
            -DMUMPS_intsize64=ON \
            -DMUMPS_metis=ON \
            -DMUMPS_find_SCALAPACK=OFF \
            -DMUMPS_scalapack=OFF
          cmake --build "$GITHUB_WORKSPACE/mumps-build" --config Release -j4
          cmake --install "$GITHUB_WORKSPACE/mumps-build"
        fi

    - name: Configure ccache
      shell: bash
      run: |
        echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
        ccache --set-config=max_size=500M
        ccache --zero-stats

    - name: Configure CMake
      shell: bash
      run: cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_UNITTESTING=ON -DUSING_MUMPS=ON -DMUMPS_ROOT="$GITHUB_WORKSPACE/mumps-install" -DCMAKE_Fortran_COMPILER="$FC" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_Fortran_COMPILER_LAUNCHER=ccache
    - name: Build
      shell: bash
      run: cmake --build "$GITHUB_WORKSPACE/build" --config $BUILD_TYPE
      env:
        MAKEFLAGS: "-j4"
    - name: ccache stats
      shell: bash
      run: ccache --show-stats
    - name: Run Unit Tests
      shell: bash
      run: ctest --test-dir "$GITHUB_WORKSPACE/build" -C $BUILD_TYPE
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
