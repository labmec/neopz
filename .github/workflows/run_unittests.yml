name: Run Unit Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [main, develop]

env:
  BUILD_TYPE: Release

jobs:
  test-linux:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/labmec/neopz-deps:latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_UNITTESTING=ON \
            -DUSING_LOG4CXX=ON \
            -DUSING_METIS=ON \
            -DUSING_MUMPS=ON \
            -DMUMPS_ROOT=$MUMPS_ROOT \
            -DMUMPS_USE_DOUBLE=ON \
            -DMUMPS_USE_COMPLEX16=ON

      - name: Build
        run: cmake --build build
        env:
          MAKEFLAGS: "-j4"

      - name: Run Unit Tests
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }}
        env:
          CTEST_OUTPUT_ON_FAILURE: 1

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create Build Environment
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_UNITTESTING=ON

      - name: Build
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: cmake --build . --config ${{ env.BUILD_TYPE }}
        env:
          MAKEFLAGS: "-j4"

      - name: Run Unit Tests
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: ctest -C ${{ env.BUILD_TYPE }}
        env:
          CTEST_OUTPUT_ON_FAILURE: 1